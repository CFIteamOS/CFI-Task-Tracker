<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Action Items</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="curefoods-logo.png">
  <link rel="apple-touch-icon" href="curefoods-logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10286b">
</head>
<body>
  <div class="brand-header">
    <img src="curefoods-logo.png" alt="Curefoods" onerror="this.style.display='none'">
    <span>Task Tracker</span>
  </div>
  <div class="wrap">
    <h1>Your action items</h1>
    <p class="subtitle" id="subtitle">Loading...</p>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <p class="progress-label" id="progressLabel"></p>
    <div class="own-task-form" id="ownTaskForm" style="display:none">
      <input type="text" id="ownTaskText" placeholder="Add your own task">
      <button id="ownTaskBtn">Add</button>
    </div>
    <div id="content"></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

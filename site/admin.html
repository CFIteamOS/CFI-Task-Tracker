<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="curefoods-logo.png">
  <link rel="apple-touch-icon" href="curefoods-logo.png">
  <script src="theme.js"></script>
</head>
<body>
  <div class="brand-header">
    <img src="curefoods-logo.png" alt="Curefoods" onerror="this.style.display='none'">
    <span>Task Tracker - Admin</span>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light mode"></button>
  </div>
  <div class="wrap">
    <div id="login" class="login-box">
      <h1>Admin login</h1>
      <input type="password" id="password" placeholder="Password" autofocus>
      <button id="loginBtn">View dashboard</button>
      <div id="loginError" class="error"></div>
    </div>
    <div id="dashboard" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <p class="progress-label" id="progressLabel"></p>

      <div class="section-title" id="formTitle">Assign a new task</div>
      <div class="assign-form">
        <div class="row">
          <details class="owner-picker" id="ownerPicker"></details>
          <input type="text" id="assignTask" placeholder="Task description">
        </div>
        <div class="row">
          <button id="assignBtn">Assign task</button>
          <button id="cancelEditBtn" class="small-btn secondary" style="display:none">Cancel edit</button>
          <span class="assign-form-status" id="assignStatus"></span>
        </div>
      </div>

      <div class="new-comments-banner" id="newCommentsBanner" style="display:none"></div>

      <div class="section-title">Pending by brand</div>
      <div class="brand-bar" id="brandBar"></div>

      <div class="table-wrap" id="table"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
